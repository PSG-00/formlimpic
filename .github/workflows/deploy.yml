name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # 1단계: CI (리눅스 환경에서 빌드 및 테스트 자동 검증)
  test-and-build:
    name: 🧪 CI (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle Test & Build
        run: ./gradlew build

  # 2단계: CD (CI 통과 시에만 GCP VM 원격 자동 배포)
  deploy:
    name: 🚀 CD (Deploy to GCP VM)
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Remote Deploy on GCP
        uses: appleboy/ssh-action@v1.2.0
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: 22
          envs: DISCORD_DEPLOY_WEBHOOK
          script: |
            cd /home/${{ secrets.GCP_VM_USER }}/formlimpic
            ./start.sh
