name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # 1단계: CI (리눅스 환경에서 빌드 및 테스트 자동 검증)
  test-and-build:
    name: 🧪 CI (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle Test & Build
        run: ./gradlew build

  # 2단계: CD (CI 통과 시에만 GCP VM 자체 러너로 자동 배포)
  deploy:
    name: 🚀 CD (Deploy to GCP VM)
    needs: test-and-build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Deploy on VM
        env:
          DISCORD_DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: |
          cd /home/psg001234/formlimpic
          git config --global --add safe.directory /home/psg001234/formlimpic || true
          git fetch origin main
          git reset --hard origin/main
          chmod +x start.sh gradlew
          ./start.sh --no-sync
