server:
  port: 8080
  # 같은 서버의 Caddy(127.0.0.1:8080)만 접근. 외부에서 8080 직접 접속 차단
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      # 정상 종료(systemctl stop/restart) 시 세션을 파일로 저장했다가 기동 시 복원 → 배포해도 로그인 유지
      persistent: true
      store-dir: ${SESSION_STORE_DIR:./data/sessions}
  tomcat:
    threads:
      max: 200
      min-spare: 100
    accept-count: 5000
    max-connections: 10000
    connection-timeout: 60000
    keep-alive-timeout: 60000

spring:
  application:
    name: formlimpic
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/formlimpic}
    username: ${DB_USERNAME:formlimpic}
    password: ${DB_PASSWORD:formlimpic-local}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 120000

formlimpic:
  journal: ${JOURNAL_PATH:./data/receipts.log}
  # 부하 테스트용 레이트리밋 우회 토큰. 비어 있으면 우회 기능 비활성화
  loadtest-bypass-token: ${FORMLIMPIC_LOADTEST_BYPASS:}
  # Caddy가 찍은 도착 시각(X-Arrived-At) 사용 여부. Caddyfile에 header_up X-Arrived-At {time.now.unix_ms} 를 넣은 뒤에만 켤 것
  trust-proxy-arrival: ${FORMLIMPIC_TRUST_PROXY_ARRIVAL:false}
