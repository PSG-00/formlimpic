server:
  port: 8080
  address: ${SERVER_ADDRESS:0.0.0.0}
  tomcat:
    threads:
      max: 200
      min-spare: 100
    accept-count: 2000
    max-connections: 10000
    connection-timeout: 60000
    keep-alive-timeout: 60000

spring:
  application:
    name: formlimpic
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/formlimpic}
    username: ${DB_USERNAME:formlimpic}
    password: ${DB_PASSWORD:formlimpic-local}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 120000

formlimpic:
  journal: ${JOURNAL_PATH:./data/receipts.log}
